# ============================================================
# AP Wanderlust — Kubernetes Deployment + Service
#
# Prereqs:
#   1. docker build -t <your-registry>/apwanderlust:1.0.0 .
#   2. docker push <your-registry>/apwanderlust:1.0.0
#   3. Replace the `image:` field below with that same tag.
#   4. kubectl apply -f deployment.yaml
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apwanderlust
  labels:
    app: apwanderlust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apwanderlust
  template:
    metadata:
      labels:
        app: apwanderlust
    spec:
      containers:
        - name: apwanderlust
          image: your-registry/apwanderlust:1.0.0   # <-- replace with your built image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: apwanderlust
  labels:
    app: apwanderlust
spec:
  type: LoadBalancer      # use ClusterIP if you're fronting this with an Ingress
  selector:
    app: apwanderlust
  ports:
    - name: http
      port: 80
      targetPort: 8080
